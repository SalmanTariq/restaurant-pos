services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pos
      MYSQL_DATABASE: pos
      MYSQL_USER: pos
      MYSQL_PASSWORD: pos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/mysql-init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upos", "-ppos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
